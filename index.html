<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ORC Path Planner</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1d2330; --muted:#6b7385; --line:#dfe3ea;
  --accent:#2563eb; --accent-ink:#fff; --danger:#dc2626; --warn:#b45309; --ok:#15803d;
  --field:#fbfbf8; --grid:#e8e8e0; --grid2:#d2d2c8; --wall:#3b3b3b;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#11141a; --panel:#1a1f28; --ink:#e7eaf0; --muted:#9aa3b5; --line:#2c3340;
    --accent:#3b82f6; --field:#1d222b; --grid:#262c37; --grid2:#343c4a; --wall:#c9ced8; --warn:#f59e0b; --ok:#22c55e; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;white-space:nowrap}
header input{flex:1;min-width:60px;max-width:220px}
main{display:flex;height:calc(100% - 50px)}
#cwrap{position:relative;flex:1;min-width:0;touch-action:none}
canvas{display:block;width:100%;height:100%}
aside{width:380px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
@media (max-width:820px){
  main{flex-direction:column;height:auto}
  #cwrap{height:min(58vh, calc(100vw * 0.72 + 120px));flex:none}
  aside{width:100%;border-left:none;border-top:1px solid var(--line)}
}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:10px;font-weight:600;color:var(--muted);border-radius:0}
.tabs button.on{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.pane{padding:12px;overflow:auto;flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:7px 10px;border-radius:8px;cursor:pointer}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.del{color:var(--danger)}
button:disabled{opacity:.45}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:6px;padding:6px 8px;width:100%}
input[type=checkbox]{width:auto}
label.f{display:block;margin:6px 0}
label.f span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1;min-width:0}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
h3{font-size:13px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;background:var(--bg)}
.card .hd{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:4px}
.card .hd .sp{flex:1}
.card .hd button{padding:2px 8px}
.hint{color:var(--muted);font-size:13px}
.warn{color:var(--warn);font-size:13px;margin:3px 0}
.okc{color:var(--ok)}
.plist button{display:block;width:100%;text-align:left;margin:4px 0}
pre{font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;
  overflow:auto;max-height:240px}
.ov{position:absolute;display:flex;gap:6px;align-items:center}
.ov button{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.ov button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#tl{left:8px;top:8px}
#tr{right:8px;top:8px}
#sim{left:8px;right:8px;bottom:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:6px 8px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
#sim input{flex:1;padding:0}
#simlbl{font-size:12px;color:var(--muted);white-space:nowrap;min-width:92px;text-align:right}
#coord{position:absolute;left:8px;bottom:58px;font-size:12px;color:var(--muted);pointer-events:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
.kv b{font-weight:600}
</style>
</head>
<body>
<header>
  <h1>🤖 ORC Path</h1>
  <input id="pname" title="Tên path" placeholder="Tên path">
  <button id="undo" title="Hoàn tác">↶</button>
  <button id="redo" title="Làm lại">↷</button>
</header>
<main>
  <div id="cwrap">
    <canvas id="cv"></canvas>
    <div class="ov" id="tl">
      <button id="mAdd" class="on">＋ Thêm điểm</button>
      <button id="mSel">✋ Chọn/kéo</button>
    </div>
    <div class="ov" id="tr">
      <button id="zIn">＋</button><button id="zOut">－</button><button id="zFit">⤢</button>
    </div>
    <div id="coord"></div>
    <div class="ov" id="sim">
      <button id="play">▶</button>
      <input id="simT" type="range" min="0" max="1000" value="0">
      <span id="simlbl">0.0 s</span>
    </div>
  </div>
  <aside>
    <div class="tabs">
      <button data-t="pt" class="on">Điểm</button>
      <button data-t="set">Cài đặt</button>
      <button data-t="exp">Xuất</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
</main>
<input type="file" id="fJson" accept=".json,application/json" hidden>
<input type="file" id="fImg" accept="image/*" hidden>

<script>
/*CORE-START*/
const Core = (() => {
  const D2R = Math.PI / 180, R2D = 180 / Math.PI;
  const SIDES = ['front', 'left', 'back', 'right'];
  const SIDE_ANG = { front: 0, left: 90, back: 180, right: -90 };
  const SIDE_VN = { front: 'trước', left: 'trái', back: 'sau', right: 'phải' };
  const WALLS = ['left', 'right', 'bottom', 'top'];
  const WALL_NORMAL = { left: 180, right: 0, bottom: -90, top: 90 };
  const WALL_VN = { left: 'trái (x=0)', right: 'phải (x=W)', bottom: 'dưới (y=0)', top: 'trên (y=H)' };
  const ST = { FOLLOW: 0, LIFT: 1, WAIT: 2, WALL: 3, TOF: 4, CUSTOM: 5 };
  const SF_ASYNC = 1, SF_CONTINUE = 2;

  function wrap180(a) { return ((a + 180) % 360 + 360) % 360 - 180; }
  function nearestOf(list, angOf, ang) {
    let best = list[0], bd = 1e9;
    for (const k of list) { const d = Math.abs(wrap180(ang - angOf[k])); if (d < bd) { bd = d; best = k; } }
    return best;
  }
  const sideFromAngle = a => nearestOf(SIDES, SIDE_ANG, a);
  const wallFacing = dir => nearestOf(WALLS, WALL_NORMAL, dir);
  function nearestWall(p, field) {
    const d = { left: p.x, right: field.w - p.x, bottom: p.y, top: field.h - p.y };
    return WALLS.reduce((a, b) => (d[a] <= d[b] ? a : b));
  }
  function sideDist(side, robot) { return (side === 'front' || side === 'back') ? robot.len / 2 : robot.wid / 2; }

  function defaultState() {
    return {
      v: 1, name: 'auto1',
      field: { w: 3000, h: 2000, grid: 100, snap: 10, bgOpacity: 0.6 },
      robot: { len: 400, wid: 400, vmax: 800, amax: 1000, alat: 800, wmax: 180, walpha: 360, dt: 20,
               liftSpeed: 250, tofSides: 'front,right' },
      points: [
        { x: 300, y: 300, th: 90, stop: true, vmax: 0, actions: [] },
        { x: 300, y: 1200, th: 90, stop: false, vmax: 0, actions: [{ type: 'lift', mm: 200, wait: false }] },
        { x: 1200, y: 1500, th: 0, stop: true, vmax: 0, actions: [{ type: 'wait', ms: 500 }] },
      ],
    };
  }

  // Centripetal Catmull-Rom (Barry-Goldman)
  function cr(p0, p1, p2, p3, u) {
    const a = 0.5, eps = 1e-3;
    const k = (P, Q) => Math.max(Math.pow(Math.hypot(Q.x - P.x, Q.y - P.y), a), eps);
    const t0 = 0, t1 = k(p0, p1), t2 = t1 + k(p1, p2), t3 = t2 + k(p2, p3);
    const t = t1 + (t2 - t1) * u;
    const L = (P, Q, ta, tb) => ({ x: ((tb - t) * P.x + (t - ta) * Q.x) / (tb - ta), y: ((tb - t) * P.y + (t - ta) * Q.y) / (tb - ta) });
    const A1 = L(p0, p1, t0, t1), A2 = L(p1, p2, t1, t2), A3 = L(p2, p3, t2, t3);
    const B1 = L(A1, A2, t0, t2), B2 = L(A2, A3, t1, t3);
    return L(B1, B2, t1, t2);
  }

  // Build one chain (stop -> ... -> stop). Returns samples [x,y,th,vx,vy,w] at dt and knot sample indexes.
  function buildChain(pts, thU, segV, robot) {
    const dt = robot.dt / 1000;
    const m = pts.length;
    const L0 = pts.length === 2 ? Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) : 1;
    if (m === 2 && L0 < 1) return rotationChain(pts[0], thU[0], thU[1], robot);
    const ext = [{ x: 2 * pts[0].x - pts[1].x, y: 2 * pts[0].y - pts[1].y }, ...pts,
                 { x: 2 * pts[m - 1].x - pts[m - 2].x, y: 2 * pts[m - 1].y - pts[m - 2].y }];
    const xs = [pts[0].x], ys = [pts[0].y], ss = [0], seg = [0], knotS = [0], knotI = [0];
    for (let j = 0; j < m - 1; j++) {
      const p0 = ext[j], p1 = ext[j + 1], p2 = ext[j + 2], p3 = ext[j + 3];
      const K = Math.max(8, Math.ceil(Math.hypot(p2.x - p1.x, p2.y - p1.y) / 4));
      for (let k = 1; k <= K; k++) {
        const q = cr(p0, p1, p2, p3, k / K);
        const ds = Math.hypot(q.x - xs[xs.length - 1], q.y - ys[ys.length - 1]);
        xs.push(q.x); ys.push(q.y); ss.push(ss[ss.length - 1] + ds); seg.push(j);
      }
      knotS.push(ss[ss.length - 1]); knotI.push(xs.length - 1);
    }
    const N = xs.length;
    const dthds = [];
    for (let j = 0; j < m - 1; j++) {
      const len = knotS[j + 1] - knotS[j];
      dthds.push(len > 1e-6 ? (thU[j + 1] - thU[j]) / len : 0);
    }
    const thAt = (s, j) => {
      const len = knotS[j + 1] - knotS[j];
      const f = len > 1e-9 ? Math.min(1, Math.max(0, (s - knotS[j]) / len)) : 1;
      return thU[j] + f * (thU[j + 1] - thU[j]);
    };
    // curvature
    const kap = new Array(N).fill(0);
    for (let i = 1; i < N - 1; i++) {
      const ax = xs[i] - xs[i - 1], ay = ys[i] - ys[i - 1], bx = xs[i + 1] - xs[i], by = ys[i + 1] - ys[i];
      const la = Math.hypot(ax, ay), lb = Math.hypot(bx, by);
      if (la < 1e-6 || lb < 1e-6) continue;
      const ang = Math.atan2(ax * by - ay * bx, ax * bx + ay * by);
      kap[i] = Math.abs(ang) / ((la + lb) / 2);
    }
    const kapS = kap.map((_, i) => { let s = 0, c = 0; for (let d = -3; d <= 3; d++) { const q = i + d; if (q >= 0 && q < N) { s += kap[q]; c++; } } return s / c; });
    const wmax = robot.wmax * D2R;
    const segLim = j => {
      let v = segV[j];
      if (Math.abs(dthds[j]) > 1e-9) v = Math.min(v, wmax / Math.abs(dthds[j]));
      return v;
    };
    const vlim = new Array(N);
    for (let i = 0; i < N; i++) {
      let v = segLim(seg[i]);
      if (knotI.includes(i) && i > 0 && i < N - 1) v = Math.min(v, segLim(Math.min(seg[i] + 1, m - 2)));
      if (kapS[i] > 1e-6) v = Math.min(v, Math.sqrt(robot.alat / kapS[i]));
      vlim[i] = Math.max(v, 5);
    }
    const v = new Array(N).fill(0);
    v[0] = 0;
    for (let i = 0; i < N - 1; i++) v[i + 1] = Math.min(vlim[i + 1], Math.sqrt(v[i] * v[i] + 2 * robot.amax * (ss[i + 1] - ss[i])));
    v[N - 1] = 0;
    for (let i = N - 2; i >= 0; i--) v[i] = Math.min(v[i], Math.sqrt(v[i + 1] * v[i + 1] + 2 * robot.amax * (ss[i + 1] - ss[i])));
    v[0] = 0;
    const tt = [0];
    for (let i = 0; i < N - 1; i++) {
      const ds = ss[i + 1] - ss[i];
      const va = (v[i] + v[i + 1]) / 2;
      tt.push(tt[i] + (ds < 1e-9 ? 0 : (va > 1e-6 ? ds / va : Math.sqrt(2 * ds / robot.amax))));
    }
    const T = tt[N - 1];
    const times = sampleTimes(T, dt);
    const samples = [];
    let i = 0;
    for (const t of times) {
      while (i < N - 2 && tt[i + 1] < t) i++;
      const span = tt[i + 1] - tt[i];
      const f = span > 1e-9 ? Math.min(1, Math.max(0, (t - tt[i]) / span)) : 1;
      const s = ss[i] + f * (ss[i + 1] - ss[i]);
      const x = xs[i] + f * (xs[i + 1] - xs[i]), y = ys[i] + f * (ys[i + 1] - ys[i]);
      const vel = v[i] + f * (v[i + 1] - v[i]);
      const ds = ss[i + 1] - ss[i];
      const tx = ds > 1e-9 ? (xs[i + 1] - xs[i]) / ds : 0, ty = ds > 1e-9 ? (ys[i + 1] - ys[i]) / ds : 0;
      const j = seg[i + 1];
      samples.push([x, y, thAt(s, j), vel * tx, vel * ty, dthds[j] * vel, vel]);
    }
    // the time-scaling above keeps exact end time; fix endpoints exactly
    samples[0] = [pts[0].x, pts[0].y, thU[0], 0, 0, 0, 0];
    samples[samples.length - 1] = [pts[m - 1].x, pts[m - 1].y, thU[m - 1], 0, 0, 0, 0];
    const knotSample = knotS.map(sk => {
      let k = 0; while (k < N - 1 && ss[k] < sk - 1e-9) k++;
      return Math.min(samples.length - 1, Math.round(tt[k] / dt));
    });
    return { samples, knotSample, T };
  }

  // Exact dt spacing (firmware assumes TRAJ_DT_S); last sample lands exactly on T.
  function sampleTimes(T, dt) {
    const out = [];
    for (let n = 0; n * dt < T - 1e-6; n++) out.push(n * dt);
    out.push(T);
    if (out.length < 2) out.unshift(0);
    return out;
  }

  function rotationChain(p, th0, th1, robot) {
    const dt = robot.dt / 1000;
    const d = th1 - th0, D = Math.abs(d), sg = Math.sign(d) || 1;
    const w = robot.wmax * D2R, al = robot.walpha * D2R;
    if (D < 1e-4) return { samples: [[p.x, p.y, th0, 0, 0, 0, 0]], knotSample: [0, 0], T: 0 };
    let ta, tc, wp;
    if (D >= w * w / al) { ta = w / al; tc = (D - w * w / al) / w; wp = w; }
    else { ta = Math.sqrt(D / al); tc = 0; wp = al * ta; }
    const T = 2 * ta + tc;
    const samples = [];
    for (const t of sampleTimes(T, dt)) {
      let ang, om;
      if (t < ta) { ang = 0.5 * al * t * t; om = al * t; }
      else if (t < ta + tc) { ang = 0.5 * al * ta * ta + wp * (t - ta); om = wp; }
      else { const r = T - t; ang = D - 0.5 * al * r * r; om = al * r; }
      samples.push([p.x, p.y, th0 + sg * ang, 0, 0, sg * om, 0]);
    }
    samples[samples.length - 1][2] = th1; samples[samples.length - 1][5] = 0;
    return { samples, knotSample: [0, samples.length - 1], T };
  }

  // Compile full plan -> { traj, steps, warnings, T, schedule }
  function compile(state) {
    const { points, robot, field } = state;
    const warnings = [];
    if (points.length < 2) return { traj: [], steps: [], warnings: ['Cần ít nhất 2 điểm.'], T: 0, schedule: [] };
    const n = points.length;
    const thU = [points[0].th * D2R];
    for (let i = 1; i < n; i++) thU.push(thU[i - 1] + wrap180(points[i].th - points[i - 1].th) * D2R);
    const isStop = points.map((p, i) => i === 0 || i === n - 1 || !!p.stop);
    for (let i = 0; i < n - 1; i++) {
      if (Math.hypot(points[i + 1].x - points[i].x, points[i + 1].y - points[i].y) < 1) { isStop[i] = true; isStop[i + 1] = true; }
    }
    const traj = [], steps = [];
    const pushActions = (p, idx, stopHere) => {
      for (const a of p.actions || []) {
        const async = !stopHere || !a.wait;
        if (a.type === 'lift') steps.push({ type: ST.LIFT, flags: async ? SF_ASYNC : 0, a: 0, b: 0, p1: +a.mm || 0, p2: 0, label: `#${idx} lift ${a.mm}mm` });
        else if (a.type === 'custom') steps.push({ type: ST.CUSTOM, flags: async ? SF_ASYNC : 0, a: a.id | 0, b: 0, p1: +a.param || 0, p2: 0, label: `#${idx} custom ${a.id}` });
        else if (!stopHere) { warnings.push(`Điểm #${idx}: "${a.type}" chỉ chạy ở điểm Dừng → bỏ qua.`); }
        else if (a.type === 'wait') steps.push({ type: ST.WAIT, flags: 0, a: 0, b: 0, p1: +a.ms || 0, p2: 0, label: `#${idx} chờ ${a.ms}ms` });
        else if (a.type === 'wall') {
          steps.push({ type: ST.WALL, flags: 0, a: SIDES.indexOf(a.side), b: WALLS.indexOf(a.wall), p1: +a.timeout || 2000, p2: 0, label: `#${idx} ép tường` });
          const err = Math.abs(wrap180(p.th + SIDE_ANG[a.side] - WALL_NORMAL[a.wall]));
          if (err > 10) warnings.push(`Điểm #${idx}: mặt ${SIDE_VN[a.side]} lệch ${err.toFixed(0)}° so với tường ${WALL_VN[a.wall]} — chỉnh góc θ.`);
          const dWall = { left: p.x, right: field.w - p.x, bottom: p.y, top: field.h - p.y }[a.wall] - sideDist(a.side, robot);
          if (dWall > 300) warnings.push(`Điểm #${idx}: cách tường ${dWall.toFixed(0)}mm, nên đặt điểm gần tường hơn (<300mm).`);
        } else if (a.type === 'tof') {
          steps.push({ type: ST.TOF, flags: 0, a: a.sensor | 0, b: WALLS.indexOf(a.wall), p1: +a.maxCorr || 150, p2: 0, label: `#${idx} ToF${a.sensor}` });
        }
      }
    };
    pushActions(points[0], 0, true);
    let a = 0;
    while (a < n - 1) {
      let b = a + 1; while (!isStop[b]) b++;
      const idxs = []; for (let i = a; i <= b; i++) idxs.push(i);
      const pts = idxs.map(i => points[i]);
      const th = idxs.map(i => thU[i]);
      const segV = idxs.slice(1).map(i => (points[i].vmax > 0 ? Math.min(points[i].vmax, robot.vmax) : robot.vmax));
      const ch = buildChain(pts, th, segV, robot);
      const base = traj.length;
      for (const s of ch.samples) traj.push(s);
      let cur = base;
      for (let k = 1; k < idxs.length - 1; k++) {
        const pi = idxs[k];
        if (!(points[pi].actions || []).length) continue;
        const at = base + ch.knotSample[k];
        if (at > cur) { steps.push({ type: ST.FOLLOW, flags: SF_CONTINUE, a: cur, b: at, p1: 0, p2: 0, label: `đi → #${pi}` }); cur = at; }
        pushActions(points[pi], pi, false);
      }
      steps.push({ type: ST.FOLLOW, flags: 0, a: cur, b: base + ch.samples.length - 1, p1: 0, p2: 0, label: `đi → #${b}` });
      pushActions(points[b], b, true);
      a = b;
    }
    // bounds check
    points.forEach((p, i) => {
      const r = Math.hypot(robot.len, robot.wid) / 2;
      if (p.x < 0 || p.y < 0 || p.x > field.w || p.y > field.h) warnings.push(`Điểm #${i} nằm ngoài sân.`);
      else if (p.x < r * 0.7 || p.y < r * 0.7 || p.x > field.w - r * 0.7 || p.y > field.h - r * 0.7) {
        const hasWall = (p.actions || []).some(x => x.type === 'wall');
        if (!hasWall) warnings.push(`Điểm #${i} sát tường, robot có thể đụng.`);
      }
    });
    // schedule for sim
    const dt = robot.dt / 1000;
    const schedule = []; let t = 0; let liftH = 0;
    for (const s of steps) {
      let dur = 0;
      if (s.type === ST.FOLLOW) dur = (s.b - s.a) * dt;
      else if (s.type === ST.WAIT) dur = s.p1 / 1000;
      else if (s.type === ST.LIFT) { if (!(s.flags & SF_ASYNC)) dur = Math.abs(s.p1 - liftH) / robot.liftSpeed; liftH = s.p1; }
      else if (s.type === ST.WALL) dur = 1.5;
      else if (s.type === ST.TOF) dur = 0.3;
      else if (s.type === ST.CUSTOM) dur = (s.flags & SF_ASYNC) ? 0 : 0.5;
      schedule.push({ step: s, t0: t, t1: t + dur }); t += dur;
    }
    return { traj, steps, warnings, T: t, schedule };
  }

  function poseAt(plan, t) {
    const { traj, schedule } = plan;
    if (!traj.length) return null;

  }

  function toHeader(state, plan) {

    L.push(`// Hệ toạ độ: gốc góc dưới-trái sân, x sang phải, y lên trên (mm). θ: rad, ngược chiều kim đồng hồ, 0 = hướng +x.`);

    L.push(`#define FIELD_W_MM ${f(state.field.w, 1)}`);
    L.push(`#define FIELD_H_MM ${f(state.field.h, 1)}`);
    L.push(`#define START_X_MM ${f(p0.x, 1)}`);
    L.push(`#define START_Y_MM ${f(p0.y, 1)}`);
    L.push(`#define START_TH_RAD ${f(p0.th * D2R, 5)}`);
    L.push(`#define TRAJ_DT_S ${f(state.robot.dt / 1000, 4)}`);
    L.push(`#define TRAJ_COUNT ${plan.traj.length}`);
    L.push(`#define STEP_COUNT ${plan.steps.length}`);
    L.push('');
    L.push(`#ifndef ORC_PATH_TYPES`);
    L.push(`#define ORC_PATH_TYPES`);
    L.push(`struct TrajPt { float x, y, th, vx, vy, w; };  // mm, mm, rad, mm/s, mm/s, rad/s (hệ sân)`);
    L.push(`enum StepType : uint8_t { ST_FOLLOW = 0, ST_LIFT = 1, ST_WAIT = 2, ST_WALL = 3, ST_TOF = 4, ST_CUSTOM = 5 };`);
    L.push(`#define SF_ASYNC    0x01  // không chờ xong, chạy bước tiếp ngay`);
    L.push(`#define SF_CONTINUE 0x02  // FOLLOW: không dừng ở cuối đoạn`);
    L.push(`// FOLLOW: a..b = chỉ số mẫu | LIFT: p1 = mm | WAIT: p1 = ms`);
    L.push(`// WALL: a = mặt robot (0 trước,1 trái,2 sau,3 phải), b = tường (0 trái,1 phải,2 dưới,3 trên), p1 = timeout ms`);
    L.push(`// TOF: a = số cảm biến, b = tường, p1 = sửa tối đa mm | CUSTOM: a = id, p1 = tham số`);
    L.push(`struct AutoStep { uint8_t type; uint8_t flags; int32_t a; int32_t b; float p1; float p2; };`);
    L.push(`#endif`);
    L.push('');
    L.push(`const TrajPt TRAJ[TRAJ_COUNT] = {`);
    for (const s of plan.traj) L.push(`  {${f(s[0], 1)}, ${f(s[1], 1)}, ${f(s[2], 4)}, ${f(s[3], 1)}, ${f(s[4], 1)}, ${f(s[5], 4)}},`);
    L.push(`};`);
    L.push('');
    L.push(`const AutoStep STEPS[STEP_COUNT] = {`);
    for (const s of plan.steps) L.push(`  {${s.type}, ${s.flags}, ${s.a}, ${s.b}, ${f(s.p1, 1)}, ${f(s.p2, 1)}},  // ${s.label}`);
    L.push(`};`);

  function mirror(state, axis) { // axis 'x' => lật trái/phải, 'y' => lật trên/dưới
    const tofSides = String(state.robot.tofSides || '').split(',').map(s => s.trim());
    for (const p of state.points) {
      if (axis === 'x') { p.x = state.field.w - p.x; p.th = wrap180(180 - p.th); }

          const sg = -SIDE_ANG[a.side];
          a.side = sideFromAngle(sg);
          a.wall = wallFacing(p.th + SIDE_ANG[a.side]);

          const sd = tofSides[a.sensor] || 'front';
          a.wall = wallFacing(p.th + (SIDE_ANG[sd] ?? 0));
        }
      }
    }
  }

  return { D2R, R2D, SIDES, SIDE_ANG, SIDE_VN, WALLS, WALL_NORMAL, WALL_VN, ST, wrap180, sideFromAngle, wallFacing,
           nearestWall, sideDist, defaultState, compile, poseAt, toHeader, mirror };
})();
/*CORE-END*/

<script>
(() => {

  ctx.strokeStyle = css('--wall'); ctx.lineWidth = 3; ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
  ctx.fillStyle = css('--muted'); ctx.font = '11px system-ui';
  ctx.fillText(`(0,0)   ${W}×${H} mm`, x0 + 2, y1 + 14);
  arrow(0, 0, 0, 0.06 * W, '#ef4444', 2); arrow(0, 0, Math.PI / 2, 0.06 * W, '#22c55e', 2);

});

function num(label, get, set, opts = {}) {

}

  const s = el('select'); for (const [v, t] of options) { const o = el('option', { value: v }, t); s.append(o); }

  return el('label', { class: 'f', style: 'display:flex;gap:6px;align-items:center' }, c, label);
}
let binds = [];
function syncInputs() { binds.forEach(f => f()); }

const ACTION_TYPES = [['lift', '⬆ Nâng/hạ lift'], ['wait', '⏱ Chờ'], ['wall', '▮ Ép tường (sửa vị trí)'], ['tof', '📏 Sửa vị trí bằng ToF'], ['custom', '★ Hành động riêng']];
function newAction(type, p) {
  if (type === 'lift') return { type, mm: 200, wait: true };
  if (type === 'wait') return { type, ms: 500 };
  if (type === 'wall') { const wall = C.nearestWall(p, S.field); return { type, wall, side: C.sideFromAngle(C.WALL_NORMAL[wall] - p.th), timeout: 2000 }; }
  if (type === 'tof') { const sides = String(S.robot.tofSides).split(',').map(s => s.trim()); return { type, sensor: 0, wall: C.wallFacing(p.th + (C.SIDE_ANG[sides[0]] ?? 0)), maxCorr: 150 }; }

    el('button', { onclick: () => { if (k > 0) { snapshot(); [list[k - 1], list[k]] = [list[k], list[k - 1]]; changed(true); } } }, '↑'),
    el('button', { onclick: () => { if (k < list.length - 1) { snapshot(); [list[k + 1], list[k]] = [list[k], list[k + 1]]; changed(true); } } }, '↓'),
    el('button', { class: 'del', onclick: () => { snapshot(); list.splice(k, 1); changed(true); } }, '✕'));
  const body = el('div');
  const sides = C.SIDES.map(s => [s, 'Mặt ' + C.SIDE_VN[s]]), walls = C.WALLS.map(w => [w, 'Tường ' + C.WALL_VN[w]]);
  if (a.type === 'lift') {
    body.append(num('Độ cao lift (mm)', () => a.mm, v => a.mm = v));
    if (stopHere) body.append(chk('Chờ lift tới nơi rồi mới đi tiếp', () => a.wait, v => a.wait = v));
    else body.append(el('div', { class: 'hint' }, 'Điểm đi qua: lift chạy song song khi xe đang chạy.'));
  } else if (a.type === 'wait') body.append(num('Thời gian chờ (ms)', () => a.ms, v => a.ms = v));
  else if (a.type === 'wall') {
    body.append(el('div', { class: 'row' }, sel_('Mặt robot chạm', sides, () => a.side, v => a.side = v), sel_('Tường', walls, () => a.wall, v => a.wall = v)));
    body.append(num('Timeout (ms)', () => a.timeout, v => a.timeout = v));
    body.append(el('button', { onclick: () => { snapshot(); p.th = C.wrap180(C.WALL_NORMAL[a.wall] - C.SIDE_ANG[a.side]); changed(true); } }, 'Đặt θ khớp với tường'));
    body.append(el('div', { class: 'hint' }, 'Xe chạy chậm về phía tường tới khi công tắc chạm, rồi đặt lại toạ độ + góc.'));
  } else if (a.type === 'tof') {
    const ts = String(S.robot.tofSides).split(',').map((s, j) => [String(j), `#${j} (${C.SIDE_VN[s.trim()] || s})`]);
    body.append(el('div', { class: 'row' }, sel_('Cảm biến', ts, () => String(a.sensor), v => a.sensor = +v), sel_('Đo tới tường', walls, () => a.wall, v => a.wall = v)));
    body.append(num('Sửa tối đa (mm)', () => a.maxCorr, v => a.maxCorr = v));
  } else {
    body.append(el('div', { class: 'row' }, num('ID hành động', () => a.id, v => a.id = Math.round(v), { step: 1 }), num('Tham số', () => a.param, v => a.param = v)));
    const note = el('input', { placeholder: 'Ghi chú (vd: kẹp vật)' }); note.value = a.note || ''; note.oninput = () => { a.note = note.value; save(); };
    body.append(el('label', { class: 'f' }, el('span', {}, 'Ghi chú'), note));
    if (stopHere) body.append(chk('Chờ hành động xong', () => a.wait, v => a.wait = v));
    body.append(el('div', { class: 'hint' }, 'Viết code cho ID này trong hàm runCustomAction() ở Auto.ino.'));
  }
  if (!stopHere && !['lift', 'custom'].includes(a.type)) body.append(el('div', { class: 'warn' }, '⚠ Hành động này chỉ chạy ở điểm Dừng.'));
  return el('div', { class: 'card' }, hd, body);
}

function renderPane() {
  binds = [];
  const pane = $('#pane'); pane.innerHTML = '';
  if (tab === 'pt') {
    if (sel < 0 || !S.points[sel]) {
      pane.append(el('div', { class: 'hint' }, mode === 'add' ? 'Chạm vào sân để thêm điểm tiếp theo. Chạm vào điểm để sửa.' : 'Chạm vào điểm để chọn. Kéo nền để di chuyển sân.'));
      const lst = el('div', { class: 'plist' });
      S.points.forEach((p, i) => lst.append(el('button', { onclick: () => { sel = i; renderPane(); draw(); } }, `#${i}  (${p.x}, ${p.y})  θ ${p.th}°  ${badge(p)}`)));
      pane.append(lst); return;
    }
    const p = S.points[sel], last = S.points.length - 1, stopHere = sel === 0 || sel === last || p.stop;
    pane.append(el('div', { class: 'btns' },
      el('button', { onclick: () => { sel = Math.max(0, sel - 1); renderPane(); draw(); } }, '◀'),
      el('b', { style: 'align-self:center' }, sel === 0 ? `#0 · Xuất phát` : sel === last ? `#${sel} · Cuối` : `Điểm #${sel}`),
      el('button', { onclick: () => { sel = Math.min(last, sel + 1); renderPane(); draw(); } }, '▶'),
      el('button', { onclick: () => { snapshot(); const q = S.points[sel + 1]; const np = JSON.parse(JSON.stringify(p)); np.actions = []; if (q) { np.x = snap((p.x + q.x) / 2); np.y = snap((p.y + q.y) / 2); np.stop = false; } else { np.x = snap(p.x + 200); } S.points.splice(sel + 1, 0, np); sel++; changed(true); } }, '＋ Chèn sau'),
      el('button', { class: 'del', onclick: () => { snapshot(); S.points.splice(sel, 1); sel = Math.min(sel, S.points.length - 1); changed(true); } }, 'Xoá')));
    pane.append(el('div', { class: 'row' }, num('X (mm)', () => p.x, v => p.x = v, { bind: 1 }), num('Y (mm)', () => p.y, v => p.y = v, { bind: 1 }), num('θ (độ)', () => p.th, v => p.th = C.wrap180(v), { bind: 1 })));
    if (sel !== 0 && sel !== last) pane.append(chk('Dừng tại điểm này (bỏ chọn = đi lướt qua)', () => !!p.stop, v => p.stop = v));
    if (sel > 0) pane.append(num(`Tốc độ tối đa đoạn #${sel - 1}→#${sel} (mm/s, 0 = mặc định ${S.robot.vmax})`, () => p.vmax || 0, v => p.vmax = v));
    pane.append(el('h3', {}, `Hành động tại điểm #${sel}`));
    if (!p.actions.length) pane.append(el('div', { class: 'hint' }, stopHere ? 'Chưa có. Các hành động chạy lần lượt sau khi xe dừng.' : 'Chưa có. Điểm đi qua chỉ nhận lift / hành động riêng (chạy song song).'));
    p.actions.forEach((a, k) => pane.append(actionCard(p, sel, a, k, stopHere)));
    const pick = el('select'); ACTION_TYPES.forEach(([v, t]) => { if (stopHere || v === 'lift' || v === 'custom') pick.append(el('option', { value: v }, t)); });
    pane.append(el('div', { class: 'row', style: 'margin-top:8px' }, pick, el('button', { class: 'pri', onclick: () => { snapshot(); p.actions.push(newAction(pick.value, p)); changed(true); } }, 'Thêm hành động')));
  } else if (tab === 'set') {
    const f = S.field, r = S.robot;
    pane.append(el('h3', {}, 'Sân'));
    pane.append(el('div', { class: 'row' }, num('Rộng W (mm)', () => f.w, v => { f.w = v; view.fitted = false; }), num('Cao H (mm)', () => f.h, v => { f.h = v; view.fitted = false; })));
    pane.append(el('div', { class: 'row' }, num('Lưới (mm)', () => f.grid, v => f.grid = Math.max(10, v)), num('Bắt điểm (mm)', () => f.snap, v => f.snap = Math.max(1, v))));
    pane.append(el('div', { class: 'btns' }, el('button', { onclick: () => $('#fImg').click() }, '🖼 Ảnh nền sân'), el('button', { onclick: () => { snapshot(); delete S.field.bg; setBg(); changed(false); } }, 'Bỏ ảnh nền'), el('button', { onclick: () => { fit(); draw(); } }, 'Vừa khung')));
    pane.append(num('Độ đậm ảnh nền (0–1)', () => f.bgOpacity ?? 0.6, v => f.bgOpacity = Math.min(1, Math.max(0, v))));
    pane.append(el('h3', {}, 'Robot'));
    pane.append(el('div', { class: 'row' }, num('Dài (mm, trước–sau)', () => r.len, v => r.len = v), num('Rộng (mm, trái–phải)', () => r.wid, v => r.wid = v)));
    pane.append(el('h3', {}, 'Chuyển động'));
    pane.append(el('div', { class: 'row' }, num('V max (mm/s)', () => r.vmax, v => r.vmax = Math.max(10, v)), num('A max (mm/s²)', () => r.amax, v => r.amax = Math.max(10, v))));
    pane.append(el('div', { class: 'row' }, num('A ngang khi cua (mm/s²)', () => r.alat, v => r.alat = Math.max(10, v)), num('ω max (°/s)', () => r.wmax, v => r.wmax = Math.max(5, v))));
    pane.append(el('div', { class: 'row' }, num('Gia tốc quay (°/s²)', () => r.walpha, v => r.walpha = Math.max(10, v)), num('Chu kỳ mẫu (ms)', () => r.dt, v => r.dt = Math.min(100, Math.max(5, v)))));
    pane.append(el('h3', {}, 'Cơ cấu & cảm biến'));
    pane.append(num('Tốc độ lift (mm/s, để mô phỏng)', () => r.liftSpeed, v => r.liftSpeed = Math.max(1, v)));
    const ts = el('input'); ts.value = r.tofSides; ts.onchange = () => { snapshot(); r.tofSides = ts.value; changed(true); };
    pane.append(el('label', { class: 'f' }, el('span', {}, 'Vị trí ToF theo thứ tự #0,#1,… (front/left/back/right) — phải khớp TOF_SIDE trong code'), ts));
    pane.append(el('div', { class: 'hint' }, 'Giá trị Dài/Rộng, ToF phải khớp với phần CẤU HÌNH trong ORC_Robot.ino.'));
  } else {
    pane.append(el('div', { class: 'kv' },
      el('span', {}, 'Thời gian ước tính'), el('b', {}, `${plan.T.toFixed(1)} s`),
      el('span', {}, 'Số mẫu quỹ đạo'), el('b', {}, `${plan.traj.length} (≈${(plan.traj.length * 24 / 1024).toFixed(1)} KB)`),
      el('span', {}, 'Số bước'), el('b', {}, String(plan.steps.length))));
    if (plan.warnings.length) plan.warnings.forEach(w => pane.append(el('div', { class: 'warn' }, '⚠ ' + w)));
    else pane.append(el('div', { class: 'okc', style: 'margin:6px 0' }, '✓ Không có cảnh báo'));
    pane.append(el('div', { class: 'btns' },
      el('button', { class: 'pri', onclick: () => dl('path_data.h', C.toHeader(S, plan), 'text/plain'), disabled: plan.traj.length ? null : '' }, '⬇ Tải path_data.h'),
      el('button', { onclick: async () => { try { await navigator.clipboard.writeText(C.toHeader(S, plan)); toast('Đã copy'); } catch (e) { toast('Không copy được'); } } }, '📋 Copy .h'),
      el('button', { onclick: () => dl(`${S.name}.json`, JSON.stringify(S, null, 1), 'application/json') }, '💾 Lưu JSON'),
      el('button', { onclick: () => $('#fJson').click() }, '📂 Mở JSON')));
    pane.append(el('h3', {}, 'Biến đổi'));
    pane.append(el('div', { class: 'btns' },
      el('button', { onclick: () => { snapshot(); C.mirror(S, 'x'); changed(true); } }, '⇋ Lật trái/phải'),
      el('button', { onclick: () => { snapshot(); C.mirror(S, 'y'); changed(true); } }, '⇵ Lật trên/dưới'),
      el('button', { class: 'del', onclick: () => { if (confirmBox()) { snapshot(); S = C.defaultState(); sel = -1; $('#pname').value = S.name; setBg(); changed(true); } } }, 'Tạo path mới')));
    pane.append(el('h3', {}, 'Xem trước path_data.h'));
    const txt = C.toHeader(S, plan).split('\n'); const pv = txt.slice(0, 32).concat(txt.length > 50 ? ['  ...'] : [], txt.slice(-(Math.min(14, txt.length - 32)))).join('\n');
    pane.append(el('pre', {}, plan.traj.length ? pv : '(chưa có)'));
  }
}
let confirmArm = 0;
function confirmBox() { const now = Date.now(); if (now - confirmArm < 3000) return true; confirmArm = now; toast('Bấm lần nữa để xoá path hiện tại'); return false; }
function toast(m) { const t = el('div', { style: 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:8px;z-index:20' }, m); document.body.append(t); setTimeout(() => t.remove(), 1800); }
function dl(name, text, type) { const a = el('a', { href: URL.createObjectURL(new Blob([text], { type })), download: name }); document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
$('#fJson').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { const j = JSON.parse(t); if (!j.points) throw 0; snapshot(); S = Object.assign(C.defaultState(), j); $('#pname').value = S.name; sel = -1; view.fitted = false; resize(); setBg(); changed(true); toast('Đã mở'); } catch (er) { toast('File JSON không hợp lệ'); } }); e.target.value = ''; };
$('#fImg').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { snapshot(); S.field.bg = rd.result; setBg(); changed(false); }; rd.readAsDataURL(f); e.target.value = ''; };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && sel >= 0) { snapshot(); S.points.splice(sel, 1); sel = Math.min(sel, S.points.length - 1); changed(true); }
  if (e.key === 'z' && (e.ctrlKey || e.metaKey)) $('#undo').click();
  if (e.key === ' ') { e.preventDefault(); $('#play').click(); }
});

renderPane(); resize();
})();
</script>
</body>
</html>
